<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everfair</title>
<style>
  :root {
    box-sizing: border-box;
    --sky-top: #03050d; --sky-mid: #0a1126; --sky-hor: #1b2a55;
    --far: #0d1630; --far2: #090f22; --mid: #070c1c; --mid2: #05091a; --fg: #02040a;
    --canopy: #04070f; --trunk: #04070f; --rim: rgba(0,0,0,0); --cloud: rgba(255,255,255,0);
    --sun-core: #fff6d6; --sun-a: rgba(255,233,160,.5); --sun-b: rgba(255,233,160,.25);
    --word: #f1eee6;
  }
  html { height: 100%; background: #03050d; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; height: 100%; overflow: hidden; background: #03050d; }

  .sky { position: fixed; inset: 0;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-hor) 82%, var(--sky-hor) 100%); }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .body { position: fixed; left: 0; top: 0; border-radius: 50%; will-change: transform; pointer-events: none; }
  .sun { width: 84px; height: 84px; margin: 0; background: var(--sun-core);
    box-shadow: 0 0 40px 16px var(--sun-a), 0 0 150px 70px var(--sun-b); }
  .moon { width: 78px; height: 78px; opacity: 0;
    background: radial-gradient(circle at 38% 36%, #f4f8ff 0%, #d3e2fb 55%, #a9c2ee 100%);
    box-shadow: 0 0 30px 10px rgba(150,185,255,.38), 0 0 120px 50px rgba(90,130,230,.22); }
  .moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 60% 32%, rgba(120,145,190,.32) 0 9%, transparent 10%),
      radial-gradient(circle at 36% 64%, rgba(120,145,190,.26) 0 12%, transparent 13%),
      radial-gradient(circle at 70% 66%, rgba(120,145,190,.2) 0 6%, transparent 7%); }

  .haze { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 85%, rgba(235,170,120,.45) 0%, rgba(230,150,110,.15) 38%, rgba(255,120,60,0) 68%); }

  .cloud { position: fixed; left: 0; height: 11vh; width: 38vw; pointer-events: none; filter: blur(7px);
    background:
      radial-gradient(ellipse 38% 50% at 28% 62%, var(--cloud), transparent 72%),
      radial-gradient(ellipse 34% 72% at 52% 44%, var(--cloud), transparent 72%),
      radial-gradient(ellipse 40% 48% at 76% 64%, var(--cloud), transparent 72%);
    animation: drift 260s linear infinite; }
  .cloud.c1 { top: 11vh; animation-duration: 300s; animation-delay: -90s; }
  .cloud.c2 { top: 22vh; width: 30vw; animation-duration: 230s; animation-delay: -190s; }
  .cloud.c3 { top: 33vh; width: 44vw; height: 9vh; animation-duration: 340s; animation-delay: -30s; }
  .cloud.c4 { top: 6vh; width: 26vw; animation-duration: 280s; animation-delay: -150s; }
  @keyframes drift { from { transform: translateX(-60vw); } to { transform: translateX(110vw); } }

  svg.land { position: fixed; left: 0; bottom: 0; width: 100%; display: block; pointer-events: none; }
  .c-fg { fill: var(--fg); }
  .grass { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
  .grass.b { animation-duration: 9s; animation-delay: -3s; }
  @keyframes sway { 0%, 100% { transform: skewX(-.8deg); } 50% { transform: skewX(.8deg); } }

  .tree { position: fixed; left: 50%; display: block; transform: translateX(-50%); transform-origin: 50% 100%;
    opacity: 0; animation: reveal 3s ease-out .3s forwards, sway-tree 12s ease-in-out 3.3s infinite; }
  .tree .tp { fill: url(#tg); }
  .tree { filter: url(#wind) drop-shadow(0 0 12px var(--rim)); }
  .shadow { position: fixed; left: 50%; display: block; transform-origin: 50% 100%; pointer-events: none;
    opacity: 0; filter: blur(2.5px); }
  .shadow path { fill: #000; }
  .sc1 { stop-color: var(--canopy); } .sc2 { stop-color: var(--trunk); }
  @keyframes sway-tree { 0%, 100% { transform: translateX(-50%) rotate(-.35deg); } 50% { transform: translateX(-50%) rotate(.35deg); } }
  .word { position: fixed; left: 50%; display: block; transform: translateX(-50%); opacity: 0;
    animation: reveal 3s ease-out .9s forwards; }
  .word .cls-1 { fill: var(--word); }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .grass, .tree { animation: none; }
    .tree, .word { opacity: 1; }
  }
</style>
